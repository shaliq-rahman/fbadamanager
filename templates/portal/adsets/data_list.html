{% for adset in adsets_data %}
<tr>
    <td>{{ forloop.counter }}</td>
    <td>{{ adset.adset_id }}</td>
    <td>{{ adset.adset_name }}</td>
    <td>{{ adset.status }}</td>
    <td>{{ adset.daily_budget }}</td>
    <td>{{ adset.bid_strategy }}</td>
    <td>{{ adset.amount_spent }}</td>
    <td>
        <div class="d-flex align-items-center">
            <a href="{% url 'portal:campaigns_adsets_ads' adset.adset_id  %}" class="btn btn-icon btn-text-secondary waves-effect waves-light rounded-pill" data-bs-toggle="tooltip" aria-label="Preview" data-bs-original-title="Preview">
                <i class="ti ti-eye ti-md"></i>
            </a>
        </div>
    </td>
</tr>
{% endfor %}
